
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Noir Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

  <main class="auth-wrapper">
    <a href="../index.html" class="brand">NOIR<span>.</span></a>

    <section class="auth-card">
      <div class="eyebrow">JOIN THE COLLECTION</div>
      <h1>Create your account</h1>
      <p class="muted">Create an account to start your shopping journey.</p>

      <div id="message" class="alert d-none" role="alert"></div>

      <form id="signupForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" id="name" class="form-control"
                 placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" class="form-control"
                   placeholder="At least 8 characters"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-password"
                    data-target="password">Show</button>
          </div>
          <div class="password-hint">Use 8+ characters, including a letter and a number.</div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" class="form-control"
                   placeholder="Re-enter your password"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-password"
                    data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-gold w-100">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </section>

    <p class="copyright">© 2026 NOIR STORE. DEMO PROJECT.</p>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
