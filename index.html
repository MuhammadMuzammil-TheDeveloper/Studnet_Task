
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR | Premium Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="store-nav">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="brand mb-0">NOIR<span>.</span></a>

      <div class="d-flex align-items-center gap-3">
        <span id="welcomeText" class="muted mb-0"></span>
        <button id="logoutBtn" class="btn btn-outline-warning btn-sm">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <main class="container store-content">
    <section class="store-hero">
      <div class="eyebrow">THE NEW COLLECTION</div>
      <h1>Style that speaks.</h1>
      <p class="mt-3 mb-4">
        Discover a refined collection made for your everyday style.
      </p>
      <button class="btn btn-gold px-4" id="shopBtn">
        Explore Collection
      </button>
    </section>

    <section class="text-center mt-5">
      <h2 class="h4">Welcome to your store</h2>
      <p class="muted mb-0">
        Your authentication system is working. Product listings come next.
      </p>
    </section>
  </main>

  <script>
    const SESSION_KEY = "noir_current_user";

    let currentUser = null;

    try {
      currentUser = JSON.parse(localStorage.getItem(SESSION_KEY));
    } catch {
      currentUser = null;
    }

    if (!currentUser || !currentUser.id || !currentUser.email) {
      window.location.replace("pages/singup.html");
    } else {
      document.getElementById("welcomeText").textContent =
        "Hi, " + currentUser.name;
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("pages/login.html");
    });

    document.getElementById("shopBtn").addEventListener("click", () => {
      alert("Product collection will be added in the next step!");
    });
  </script>

</body>
</html>
